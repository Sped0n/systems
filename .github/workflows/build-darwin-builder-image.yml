name: Build Darwin Builder Image

on:
  push:
    branches: [main]
    paths:
      - "modules/darwin/services/builder/image/**"
      - ".github/workflows/build-darwin-builder-image.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: darwin-builder

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read image metadata
        id: image
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^FROM nixos\/nix:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' modules/darwin/services/builder/image/Dockerfile)"
          if [ -z "$version" ]; then
            echo "Dockerfile must use FROM nixos/nix:<x.xx.x>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Read nixpkgs revision
        id: nixpkgs
        run: |
          set -euo pipefail
          revision="$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          # Override the action's default insecure entitlements.
          buildkitd-flags: --debug=false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: modules/darwin/services/builder/image
          build-args: |
            NIXPKGS_REV=${{ steps.nixpkgs.outputs.revision }}
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sped0n/${{ env.IMAGE_NAME }}:latest
            ghcr.io/sped0n/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
